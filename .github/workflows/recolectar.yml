name: Recolección

on:
  schedule:
    # Cada hora, en el minuto 17. Hora UTC.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    # La clave vive cifrada como secreto del repositorio. Se declara acá, a
    # nivel del trabajo, para que los pasos puedan preguntar si está cargada.
    env:
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Eje seguridad ---

      # Solo corre si la clave está cargada. Sin clave no se ejecuta y se deja
      # constancia en el registro de la corrida, en vez de fallar cada hora.
      - name: Economias ilicitas - focos de calor (NASA FIRMS)
        id: focos
        if: env.NASA_FIRMS_MAP_KEY != ''
        continue-on-error: true
        run: python colectores/focos.py

      - name: Aviso si falta la clave de FIRMS
        if: env.NASA_FIRMS_MAP_KEY == ''
        run: |
          echo "Sin NASA_FIRMS_MAP_KEY cargada. El colector de focos de calor no se ejecuto."

      # --- Eje inteligencia estrategica ---
      # ACNUR publica una vez al ano: se consulta a diario, no cada hora.
      - name: Desplazamiento forzado (ACNUR)
        id: desplazamiento
        if: github.event_name == 'workflow_dispatch' || fromJSON(github.run_number) % 24 == 0
        continue-on-error: true
        run: python colectores/desplazamiento.py

      - name: Guardar lo recolectado
        if: always()
        run: |
          git config user.name "siwa"
          git config user.email "actions@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "Recolección $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # Si algún colector falló, la corrida queda marcada en rojo. El dato
      # anterior no se pisa y la falla queda registrada en datos/publico/estado/.
      - name: Declarar las fallas
        if: always()
        run: |
          fallo=0
          [ "${{ steps.focos.outcome }}" = "failure" ] && { echo "Falló el colector de focos de calor."; fallo=1; }
          [ "${{ steps.desplazamiento.outcome }}" = "failure" ] && { echo "Falló el colector de desplazamiento forzado."; fallo=1; }
          exit $fallo
