name: Recolección

on:
  schedule:
    # Cada hora: lo que cambia seguido.
    - cron: "17 * * * *"
    # Una vez por día: series anuales y catálogos, que cambian despacio.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    env:
      # A mano o en la corrida diaria se recolecta todo; en las horarias, solo lo que cambia seguido.
      COMPLETA: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 5 * * *' }}

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Transversal, cada hora ---
      - name: Cobertura noticiosa cruzada
        id: cobertura
        continue-on-error: true
        run: python colectores/cobertura.py

      - name: Circulacion en red social abierta
        id: redes
        continue-on-error: true
        run: python colectores/redes.py

      - name: Difusion en canales de mensajeria
        id: telegram
        continue-on-error: true
        run: python colectores/telegram.py

      - name: Conflictos territoriales y mineria ilegal
        id: conflictos
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/conflictos.py

      - name: Brecha espejo del comercio declarado
        id: comercio
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/comercio.py

      - name: Extorsion informatica
        id: ransomware
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/ransomware.py

      - name: Indice de Transformacion Bertelsmann
        id: bti
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/bti.py

      - name: Informes de la Fundacion
        id: fundacion
        continue-on-error: true
        run: python colectores/fundacion.py

      - name: Indice de Opacidad
        id: opacidad
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/opacidad.py

      - name: Publicacion oficial reciente
        id: reciente
        continue-on-error: true
        run: python colectores/reciente_oficial.py

      - name: Consulta dirigida a la fuente primaria
        id: consulta
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/consulta.py

      - name: Medicion de red (OONI, IODA y FIRST)
        id: ciber
        continue-on-error: true
        run: python colectores/ciber.py

      - name: Sanciones y personas expuestas (OpenSanctions)
        id: sanciones
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/sanciones.py

      - name: Libertad de prensa (Reporteros Sin Fronteras)
        id: prensa
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/prensa_libre.py

      # Una consulta de RECUENTO por Estado: la descarga completa pesa 261 MB y
      # no hace falta bajarla para saber cuantos asientos hay.
      - name: Especies protegidas (CITES)
        id: cites
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/cites.py

      # Cada hora: es la unica capa que ve lo que esta ardiendo AHORA.
      - name: Focos de calor (NASA FIRMS)
        id: focos
        continue-on-error: true
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: python colectores/focos.py

      # UNICO COLECTOR CON SECRETO DE TODO EL REGISTRO. Si el secreto no esta NO
      # falla: declara «sin credencial» y los 33 Estados quedan SIN MIRAR, que no
      # es lo mismo que en cero. Corre una vez por dia porque cada corrida cuesta
      # un inicio de sesion.
      - name: Brecha entre lo registrado y lo publicado
        id: brecha
        continue-on-error: true
        if: env.COMPLETA == 'true'
        env:
          ACLED_USUARIO: ${{ secrets.ACLED_USUARIO }}
          ACLED_CLAVE: ${{ secrets.ACLED_CLAVE }}
        run: python colectores/brecha.py

      - name: Contrataciones abiertas
        id: contratacion
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/contratacion.py

      - name: Archivo de la web (lo que dejo de publicarse)
        id: archivo
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/archivo.py

      - name: Imagen satelital disponible (Copernicus)
        id: copernicus
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/copernicus.py

      # VA ULTIMO A PROPOSITO: la memoria compara lo que los demas colectores
      # acaban de escribir contra lo que ya sabia. Si corriera antes, anotaria
      # el estado de ayer como si fuera el de hoy.
      # Seis consultas baratas por vuelta. Mide si las fuentes TRABADAS volvieron,
      # sin depender de que alguien se acuerde de reintentar —y nadie se acuerda—.
      - name: Banco de pruebas de fuentes candidatas
        id: sondeo
        continue-on-error: true
        run: python colectores/sondeo.py

      - name: Memoria del registro (que cambio)
        id: memoria
        continue-on-error: true
        run: python colectores/memoria.py

      # --- Series anuales y catalogos, una vez por dia ---
      - name: Indicadores comparables (Banco Mundial)
        id: banco
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/banco_mundial.py

      - name: Indicadores de los ODS (Naciones Unidas)
        id: ods
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/onu_ods.py

      - name: Desplazamiento forzado (ACNUR)
        id: desplazamiento
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/desplazamiento.py

      - name: Democracia, terrorismo y conflicto (V-Dem, GTD, UCDP)
        id: owd
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/owd.py

      - name: Padron de fuentes oficiales
        id: oficiales
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/fuentes_oficiales.py

      # Las cifras de la portada —las que ve quien comparte el enlace y las que
      # lee un buscador— se recalculan acá. Escritas a mano envejecen solas: en
      # dos dias seguidos quedaron diciendo «15 fuentes» cuando eran 16 y 19.
      # Las cuarenta puertas se GENERAN del padrón: una por región, zona y
      # Estado. Escribirlas a mano seria mantener cuarenta copias, que es la
      # duplicacion que este registro ya pago dos veces.
      - name: Generar las cuarenta puertas
        if: always()
        continue-on-error: true
        run: python herramientas/puertas.py

      # El canal de novedades sale DESPUES de la memoria: anuncia lo que ella
      # acaba de observar. Es la unica forma de aviso que no exige lista de
      # correo, servicio de envio ni credenciales.
      - name: Escribir el canal de novedades
        if: always()
        continue-on-error: true
        run: python herramientas/novedades.py

      - name: Sellar las cifras de la portada
        if: always()
        continue-on-error: true
        run: python herramientas/sellar-portada.py

      - name: Guardar lo recolectado
        if: always()
        run: |
          git config user.name "siwa"
          git config user.email "actions@users.noreply.github.com"
          # La regla de .gitattributes necesita que el controlador exista.
          git config merge.ours.driver true
          git add datos/ sitio/index.html sitio/pais sitio/zona index.html sitemap.xml novedades.xml README.md
          git diff --staged --quiet || git commit -m "Recolección $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Si alguien subio algo mientras corria la recoleccion, se trae y se
          # reintenta en lugar de fallar. Los datos se resuelven solos por la
          # regla de .gitattributes; el codigo ajeno se conserva intacto.
          for intento in 1 2 3; do
            git push && break
            git pull --no-rebase --no-edit origin main || exit 1
          done

      # Si algun colector fallo, la corrida queda en rojo. El dato anterior no se pisa
      # y la falla queda registrada en datos/publico/estado/.
      - name: Declarar las fallas
        if: always()
        run: |
          fallo=0
          [ "${{ steps.cobertura.outcome }}" = "failure" ] && { echo "Falló el colector de cobertura noticiosa."; fallo=1; }
          [ "${{ steps.banco.outcome }}" = "failure" ] && { echo "Falló el colector del Banco Mundial."; fallo=1; }
          [ "${{ steps.ods.outcome }}" = "failure" ] && { echo "Falló el colector de los ODS."; fallo=1; }
          [ "${{ steps.desplazamiento.outcome }}" = "failure" ] && { echo "Falló el colector de desplazamiento forzado."; fallo=1; }
          [ "${{ steps.oficiales.outcome }}" = "failure" ] && { echo "Falló el padrón de fuentes oficiales."; fallo=1; }
          [ "${{ steps.redes.outcome }}" = "failure" ] && { echo "Falló el colector de circulación en redes."; fallo=1; }
          [ "${{ steps.owd.outcome }}" = "failure" ] && { echo "Falló el colector de democracia y conflicto."; fallo=1; }
          [ "${{ steps.telegram.outcome }}" = "failure" ] && { echo "Falló el colector de canales de mensajería."; fallo=1; }
          [ "${{ steps.conflictos.outcome }}" = "failure" ] && { echo "Falló el colector de conflictos territoriales."; fallo=1; }
          [ "${{ steps.comercio.outcome }}" = "failure" ] && { echo "Falló el colector de brecha espejo."; fallo=1; }
          [ "${{ steps.ransomware.outcome }}" = "failure" ] && { echo "Falló el colector de extorsión informática."; fallo=1; }
          [ "${{ steps.bti.outcome }}" = "failure" ] && { echo "Falló el colector del índice Bertelsmann."; fallo=1; }
          [ "${{ steps.fundacion.outcome }}" = "failure" ] && { echo "Falló el colector de informes de la Fundación."; fallo=1; }
          [ "${{ steps.opacidad.outcome }}" = "failure" ] && { echo "Falló el colector del índice de opacidad."; fallo=1; }
          [ "${{ steps.reciente.outcome }}" = "failure" ] && { echo "Falló el colector de publicación oficial reciente."; fallo=1; }
          [ "${{ steps.consulta.outcome }}" = "failure" ] && { echo "Falló el colector de consulta dirigida."; fallo=1; }
          [ "${{ steps.ciber.outcome }}" = "failure" ] && { echo "Falló el colector de medición de red."; fallo=1; }
          [ "${{ steps.sanciones.outcome }}" = "failure" ] && { echo "Falló el colector de sanciones."; fallo=1; }
          [ "${{ steps.prensa.outcome }}" = "failure" ] && { echo "Falló el colector de libertad de prensa."; fallo=1; }
          [ "${{ steps.cites.outcome }}" = "failure" ] && { echo "Falló el colector de especies protegidas."; fallo=1; }
          [ "${{ steps.focos.outcome }}" = "failure" ] && { echo "Falló el colector de focos de calor."; fallo=1; }
          [ "${{ steps.brecha.outcome }}" = "failure" ] && { echo "Falló el colector de la brecha."; fallo=1; }
          [ "${{ steps.contratacion.outcome }}" = "failure" ] && { echo "Falló el colector de contrataciones abiertas."; fallo=1; }
          [ "${{ steps.archivo.outcome }}" = "failure" ] && { echo "Falló el colector del archivo de la web."; fallo=1; }
          [ "${{ steps.copernicus.outcome }}" = "failure" ] && { echo "Falló el colector de imagen satelital."; fallo=1; }
          [ "${{ steps.memoria.outcome }}" = "failure" ] && { echo "Falló la memoria del registro."; fallo=1; }
          [ "${{ steps.sondeo.outcome }}" = "failure" ] && { echo "Falló el banco de pruebas."; fallo=1; }
          exit $fallo
