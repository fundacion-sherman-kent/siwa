name: Recolección sin clave

on:
  schedule:
    # Cada hora, en el minuto 17. Hora UTC.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sismos (USGS)
        id: sismos
        continue-on-error: true
        run: python colectores/sismos.py

      - name: Tipos de cambio (BCE)
        id: fx
        continue-on-error: true
        run: python colectores/fx.py

      - name: Guardar lo recolectado
        if: always()
        run: |
          git config user.name "tabularium"
          git config user.email "actions@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "Recolección $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # Si algún colector falló, la corrida queda marcada en rojo. El dato
      # anterior no se pisa y la falla queda registrada en datos/publico/estado/.
      - name: Declarar las fallas
        if: always()
        run: |
          fallo=0
          [ "${{ steps.sismos.outcome }}" = "failure" ] && { echo "Falló el colector de sismos."; fallo=1; }
          [ "${{ steps.fx.outcome }}" = "failure" ] && { echo "Falló el colector de tipos de cambio."; fallo=1; }
          exit $fallo
