name: Recolección

on:
  schedule:
    # Cada hora: lo que cambia seguido.
    - cron: "17 * * * *"
    # Una vez por día: series anuales y catálogos, que cambian despacio.
    - cron: "40 5 * * *"
  workflow_dispatch:

# DOS CORRIDAS NO PUEDEN PISARSE. El 11 de septiembre de 2026 una corrida a mano
# —la pasada completa, veintiún minutos— seguía trabajando cuando arrancó la
# programada de la hora. La programada publicó primero; la otra, al terminar, se
# encontró con que el repositorio había cambiado, no pudo fusionar y PERDIÓ TODO
# LO QUE HABÍA RECOLECTADO. Entre eso, la primera medición de tráfico de
# internet por Estado, que era justamente lo que se había ido a buscar.
#
# El daño no se vio en ninguna parte: la corrida programada quedó en verde, el
# sitio siguió al día, y lo único que hubo fue una corrida en rojo que parecía
# un colector caído.
#
# Con esto, GitHub deja pasar de a una: la segunda espera a que termine la
# primera. Se espera y no se cancela la que está corriendo, porque la que está
# corriendo ya gastó su trabajo; si mientras tanto se acumula más de una en la
# cola, GitHub descarta las del medio, que es lo correcto: la recolección
# siguiente trae lo mismo y más fresco.
concurrency:
  group: publicar-en-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    env:
      # A mano o en la corrida diaria se recolecta todo; en las horarias, solo lo que cambia seguido.
      COMPLETA: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 5 * * *' }}

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Transversal, cada hora ---
      - name: Cobertura noticiosa cruzada
        id: cobertura
        continue-on-error: true
        run: python colectores/cobertura.py

      - name: Circulacion en red social abierta
        id: redes
        continue-on-error: true
        run: python colectores/redes.py

      - name: Difusion en canales de mensajeria
        id: telegram
        continue-on-error: true
        run: python colectores/telegram.py

      - name: Conflictos territoriales y mineria ilegal
        id: conflictos
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/conflictos.py

      - name: Brecha espejo del comercio declarado
        id: comercio
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/comercio.py

      - name: Extorsion informatica
        id: ransomware
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/ransomware.py

      - name: Indice de Transformacion Bertelsmann
        id: bti
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/bti.py

      # DIARIO, NO CADA HORA. El canal propio no cambia cada hora, y cada llamada
      # desde un centro de datos es otra tirada contra la verificacion anti-robot
      # del alojamiento: era la causa de la MITAD de las corridas en rojo.
      - name: Informes de la Fundacion
        id: fundacion
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/fundacion.py

      - name: Indice de Opacidad
        id: opacidad
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/opacidad.py

      - name: Publicacion oficial reciente
        id: reciente
        continue-on-error: true
        run: python colectores/reciente_oficial.py

      # EL PADRON SUBNACIONAL: las unidades de primer orden de los 33 Estados,
      # de dos fuentes que se reparten el padron sin superponerse, y la regla
      # que decide si cada una admite tasa o solo recuento.
      - name: Padron de unidades de primer orden
        id: unidades
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/unidades.py

      # EL PRIMER DATO POR UNIDAD, de la fuente nacional de cada Estado.
      - name: Dato subnacional por unidad
        id: subnacional_datos
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/subnacional_datos.py

      # EL CENSO DE FUENTES SUBNACIONALES. No publica cifras de criminalidad:
      # publica QUIEN publica, en que formato y con que frescura. Es la materia
      # prima del contraste vertical y, ademas, una medicion de transparencia
      # que hoy no existe en la region.
      # GASTO DEL ESTADO POR FUNCION: seguridad y defensa, con serie larga. Es
      # otra fuente y por eso es otro conjunto: no se le cuelga al Banco Mundial.
      # EDUCACION, la materia que el eje Desarrollo no medía en absoluto.
      # CLOUDFLARE RADAR. La llave es de solo lectura y gratuita. El colector se
      # escribio SIN PODER PROBARLO —la llave vive aca y no en la maquina donde se
      # programo—, asi que declara lo que no entiende en vez de inventarlo. Esta
      # corrida es su verdadera prueba.
      - name: Trafico de internet por Estado
        id: radar
        continue-on-error: true
        if: env.COMPLETA == 'true'
        env:
          CLOUDFLARE_RADAR: ${{ secrets.CLOUDFLARE_RADAR }}
        run: python colectores/radar.py

      # LA SEGUNDA FUENTE DEL BLOQUE LABORAL. Dos de sus tres medidas ya las
      # publica otro organismo: estan para poder compararlas, no para
      # reemplazarlas. La regla de la casa pide dos fuentes por dato.
      # MUERTES QUE NO SON DELITO, Y SALUD. Lo que ningun organismo de
      # seguridad cuenta porque no es delito, y que sin embargo mata: en varios
      # Estados del padron el suicidio mata mas gente que el homicidio.
      # RECURSOS ESTRATEGICOS: que produce cada Estado y cuanto pesa en el mundo.
      # Dos fuentes oficiales que no piden credencial. Va en la pasada completa
      # porque las dos publican una vez al año: pedirlas cada hora seria pedir
      # sesenta veces por dia un numero que cambia una vez por ano.
      - name: Recursos estrategicos (minerales e hidrocarburos)
        id: recursos
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/recursos.py

      - name: Muertes no delictivas y salud
        id: oms
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/oms.py

      - name: Trabajo y desempleo
        id: oit
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/oit.py

      - name: Educación
        id: unesco
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/unesco.py

      - name: Gasto en seguridad y defensa
        id: gasto_publico
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/gasto_publico.py

      - name: Censo de fuentes subnacionales
        id: subnacional
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/subnacional.py

      - name: Consulta dirigida a la fuente primaria
        id: consulta
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/consulta.py

      - name: Medicion de red (OONI, IODA y FIRST)
        id: ciber
        continue-on-error: true
        run: python colectores/ciber.py

      - name: Sanciones y personas expuestas (OpenSanctions)
        id: sanciones
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/sanciones.py

      - name: Libertad de prensa (Reporteros Sin Fronteras)
        id: prensa
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/prensa_libre.py

      - name: Pobreza por ingresos (CEPALSTAT)
        id: pobreza
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/pobreza.py

      - name: Percepcion de corrupcion (Transparency International)
        id: ipc
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/percepcion_corrupcion.py

      - name: Desastres y emergencias (IFRC GO)
        id: desastres
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/desastres.py

      # YA NO USA SECRETO. Se gestiono la credencial de la interfaz de UCDP y
      # funciona, pero el MISMO conjunto se descarga como archivo, sin credencial
      # y sin tope diario, y esa puerta es mejor: no depende de un secreto, no
      # gasta cuota y se puede probar antes de publicar. El secreto UCDP_TOKEN
      # queda cargado para lo que el archivo no da —consultas filtradas del
      # conjunto georreferenciado, evento por evento—.
      - name: Violencia organizada (UCDP)
        id: ucdp
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/ucdp.py

      # Clasificacion anual de un proyecto academico: no cambia de una hora a
      # otra. Va en la corrida diaria.
      - name: Regimen politico (V-Dem via Our World in Data)
        id: regimen
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/regimen_politico.py

      # Informe anual: se lo mira cada dia solo para no perderse la edicion nueva
      # el dia que salga. Son 34 paginas por corrida.
      - name: Trata de personas (Departamento de Estado)
        id: trata
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/trata_personas.py

      # Tabla de ratificaciones de un tratado: cambia unas pocas veces por año.
      # Va en la corrida diaria.
      - name: Bienes culturales (UNIDROIT 1995)
        id: bienes
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/bienes_culturales.py

      # Una consulta de RECUENTO por Estado: la descarga completa pesa 261 MB y
      # no hace falta bajarla para saber cuantos asientos hay.
      - name: Especies protegidas (CITES)
        id: cites
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/cites.py

      # Indice bienal: no cambia de una hora a otra. Va en la corrida diaria.
      - name: Crimen organizado (Global Initiative)
        id: crimen
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/crimen_organizado.py

      - name: Designados por el Consejo de Seguridad
        id: designados
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/designados.py

      # Sesenta y seis consultas con pausa de cortesia: va en la corrida diaria.
      - name: Comercio de armas (Comtrade, capitulo 93)
        id: armas
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/armas.py

      # El explorador PROPONE, no publica: toca puertas y deja el hallazgo
      # declarado para que una persona decida.
      - name: Explorador de puertas de datos oficiales
        id: explorador
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/explorador.py

      - name: Sismicidad (USGS)
        id: sismos
        continue-on-error: true
        run: python colectores/sismos.py

      # Cada hora: es la unica capa que ve lo que esta ardiendo AHORA.
      - name: Focos de calor (NASA FIRMS)
        id: focos
        continue-on-error: true
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: python colectores/focos.py

      # UNICO COLECTOR CON SECRETO DE TODO EL REGISTRO. Si el secreto no esta NO
      # falla: declara «sin credencial» y los 33 Estados quedan SIN MIRAR, que no
      # es lo mismo que en cero. Corre una vez por dia porque cada corrida cuesta
      # un inicio de sesion.
      - name: Brecha entre lo registrado y lo publicado
        id: brecha
        continue-on-error: true
        if: env.COMPLETA == 'true'
        env:
          ACLED_USUARIO: ${{ secrets.ACLED_USUARIO }}
          ACLED_CLAVE: ${{ secrets.ACLED_CLAVE }}
        run: python colectores/brecha.py

      - name: Contrataciones abiertas
        id: contratacion
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/contratacion.py

      - name: Archivo de la web (lo que dejo de publicarse)
        id: archivo
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/archivo.py

      - name: Imagen satelital disponible (Copernicus)
        id: copernicus
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/copernicus.py

      # VA ULTIMO A PROPOSITO: la memoria compara lo que los demas colectores
      # acaban de escribir contra lo que ya sabia. Si corriera antes, anotaria
      # el estado de ayer como si fuera el de hoy.
      # Seis consultas baratas por vuelta. Mide si las fuentes TRABADAS volvieron,
      # sin depender de que alguien se acuerde de reintentar —y nadie se acuerda—.
      - name: Banco de pruebas de fuentes candidatas
        id: sondeo
        continue-on-error: true
        run: python colectores/sondeo.py

      - name: Memoria del registro (que cambio)
        id: memoria
        continue-on-error: true
        run: python colectores/memoria.py

      # --- Series anuales y catalogos, una vez por dia ---
      - name: Indicadores comparables (Banco Mundial)
        id: banco
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/banco_mundial.py

      - name: Indicadores de los ODS (Naciones Unidas)
        id: ods
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/onu_ods.py

      - name: Desplazamiento forzado (ACNUR)
        id: desplazamiento
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/desplazamiento.py

      # Planilla anual del Informe Mundial sobre las Drogas: no cambia de una
      # hora a otra. Va en la corrida diaria.
      - name: Incautaciones y cultivo de coca (UNODC)
        id: drogas
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/drogas.py

      # La segunda fuente de homicidios. Serie anual: corrida diaria.
      - name: Homicidios · segunda fuente (OMS)
        id: oms_salud
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/oms_homicidios.py

      # Femicidios y hacinamiento carcelario. Serie anual: corrida diaria.
      - name: CEPAL · femicidios, cárceles y seguridad ciudadana
        id: cepal
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/cepal.py

      # El registro de portales de compras cambia todos los días: va en la
      # corrida horaria, que es donde vive lo que se mueve.
      - name: Contrataciones abiertas (OCDS)
        id: contrataciones_abiertas
        continue-on-error: true
        run: python colectores/contrataciones_abiertas.py

      - name: Democracia, terrorismo y conflicto (V-Dem, GTD, UCDP)
        id: owd
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/owd.py

      - name: Padron de fuentes oficiales
        id: oficiales
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/fuentes_oficiales.py

      # Las cifras de la portada —las que ve quien comparte el enlace y las que
      # lee un buscador— se recalculan acá. Escritas a mano envejecen solas: en
      # dos dias seguidos quedaron diciendo «15 fuentes» cuando eran 16 y 19.
      # EL INDICE DE OPACIDAD VA ULTIMO ENTRE LOS COLECTORES, y no es un capricho
      # de orden: se DERIVA de otros seis —explorador, archivo, contratacion,
      # armas, cites y oficiales—. Si corriera antes, calcularia con los datos de
      # ayer y nadie lo notaria.
      - name: Indice de Opacidad (edicion uno, el puntaje)
        id: indice_opacidad
        continue-on-error: true
        if: env.COMPLETA == 'true'
        run: python colectores/indice_opacidad.py

      # LA MINERIA va despues de TODO lo que recolecta: cruza lo que quedo
      # escrito en esta corrida. Deja pistas, no conclusiones.
      - name: Mineria sobre el propio registro
        id: mineria
        if: always()
        continue-on-error: true
        run: python herramientas/mineria.py

      # LA HISTORIA DEL INDICE va justo despues del indice y antes de todo lo
      # que lo muestra: archiva el puntaje del dia para que exista evolucion.
      # Sin esto el indice contesta «como esta» y nunca «esta mejorando».
      - name: Historia del Indice de Opacidad
        id: opacidad_historia
        if: always()
        continue-on-error: true
        run: python herramientas/opacidad-historia.py

      # El canal de novedades sale DESPUES de la memoria: anuncia lo que ella
      # acaba de observar. Es la unica forma de aviso que no exige lista de
      # correo, servicio de envio ni credenciales.
      #
      # Y va ANTES de las puertas: cada puerta ofrece el canal de SU Estado, y
      # para ofrecerlo tiene que existir. Al reves, la puerta ofrecia el canal
      # de la corrida anterior.
      - name: Escribir el canal de novedades
        if: always()
        continue-on-error: true
        run: python herramientas/novedades.py

      # Las cuarenta puertas se GENERAN del padrón: una por región, zona y
      # Estado. Escribirlas a mano seria mantener cuarenta copias, que es la
      # duplicacion que este registro ya pago dos veces.
      - name: Generar las cuarenta puertas
        if: always()
        continue-on-error: true
        run: python herramientas/puertas.py

      - name: Sellar las cifras de la portada
        if: always()
        continue-on-error: true
        run: python herramientas/sellar-portada.py

      # El catalogo va ULTIMO entre los generadores: recorre lo que quedo
      # escrito en esta corrida. Si corriera antes, publicaria el catalogo de
      # la corrida anterior, que es peor que no publicar ninguno.
      - name: Catalogo publico de datos (indice y documentacion)
        if: always()
        continue-on-error: true
        run: python herramientas/indice-datos.py

      # LA AUDITORIA VA ULTIMA Y NO CORTA LA CORRIDA EN EL ACTO. Corre despues de
      # todo lo demas para revisar lo que quedo escrito, y se le deja terminar
      # con `continue-on-error` A PROPOSITO: su resultado tiene que llegar a
      # `datos/publico/auditoria.json` y publicarse aunque haya fallas -sobre
      # todo si hay fallas-. La corrida queda en rojo un paso mas abajo, en
      # «Declarar las fallas», que es donde este repositorio junta los avisos.
      # LA REGLA DE LAS DOS FUENTES, medida sola. Cuenta productores
      # independientes por asunto, no archivos: dos indicadores del mismo
      # organismo no son dos fuentes por mas que sean dos numeros. Falla si un
      # asunto que tenia dos se queda con una, o si entra una materia sin
      # clasificar, que es una materia que este control no podria vigilar.
      - name: La regla de las dos fuentes
        id: segunda_fuente
        continue-on-error: true
        run: python herramientas/segunda-fuente.py

      - name: Auditoria del registro
        id: auditoria
        if: always()
        continue-on-error: true
        run: python herramientas/auditoria.py

      - name: Guardar lo recolectado
        if: always()
        run: |
          git config user.name "siwa"
          git config user.email "actions@users.noreply.github.com"
          # La regla de .gitattributes necesita que el controlador exista.
          git config merge.ours.driver true
          git add datos/ sitio/index.html sitio/pais sitio/zona index.html sitemap.xml novedades.xml novedades/ README.md
          git diff --staged --quiet || git commit -m "Recolección $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Si alguien subio algo mientras corria la recoleccion, se trae y se
          # reintenta en lugar de fallar. Los datos se resuelven solos por la
          # regla de .gitattributes; el codigo ajeno se conserva intacto.
          for intento in 1 2 3; do
            git push && break
            git pull --no-rebase --no-edit origin main || exit 1
          done

      # Si algun colector fallo, la corrida queda en rojo. El dato anterior no se pisa
      # y la falla queda registrada en datos/publico/estado/.
      - name: Declarar las fallas
        if: always()
        run: |
          fallo=0
          [ "${{ steps.cobertura.outcome }}" = "failure" ] && { echo "Falló el colector de cobertura noticiosa."; fallo=1; }
          [ "${{ steps.banco.outcome }}" = "failure" ] && { echo "Falló el colector del Banco Mundial."; fallo=1; }
          [ "${{ steps.ods.outcome }}" = "failure" ] && { echo "Falló el colector de los ODS."; fallo=1; }
          [ "${{ steps.desplazamiento.outcome }}" = "failure" ] && { echo "Falló el colector de desplazamiento forzado."; fallo=1; }
          [ "${{ steps.drogas.outcome }}" = "failure" ] && { echo "Falló el colector de incautaciones y cultivo de coca (UNODC)."; fallo=1; }
          [ "${{ steps.oms.outcome }}" = "failure" ] && { echo "Falló el colector de homicidios de la OMS."; fallo=1; }
          [ "${{ steps.cepal.outcome }}" = "failure" ] && { echo "Falló el colector de femicidios y cárceles (CEPAL)."; fallo=1; }
          [ "${{ steps.contrataciones_abiertas.outcome }}" = "failure" ] && { echo "Falló el colector de contrataciones abiertas."; fallo=1; }
          [ "${{ steps.oficiales.outcome }}" = "failure" ] && { echo "Falló el padrón de fuentes oficiales."; fallo=1; }
          [ "${{ steps.redes.outcome }}" = "failure" ] && { echo "Falló el colector de circulación en redes."; fallo=1; }
          [ "${{ steps.owd.outcome }}" = "failure" ] && { echo "Falló el colector de democracia y conflicto."; fallo=1; }
          [ "${{ steps.telegram.outcome }}" = "failure" ] && { echo "Falló el colector de canales de mensajería."; fallo=1; }
          [ "${{ steps.conflictos.outcome }}" = "failure" ] && { echo "Falló el colector de conflictos territoriales."; fallo=1; }
          [ "${{ steps.comercio.outcome }}" = "failure" ] && { echo "Falló el colector de brecha espejo."; fallo=1; }
          [ "${{ steps.ransomware.outcome }}" = "failure" ] && { echo "Falló el colector de extorsión informática."; fallo=1; }
          [ "${{ steps.bti.outcome }}" = "failure" ] && { echo "Falló el colector del índice Bertelsmann."; fallo=1; }
          [ "${{ steps.fundacion.outcome }}" = "failure" ] && { echo "Falló el colector de informes de la Fundación."; fallo=1; }
          [ "${{ steps.opacidad.outcome }}" = "failure" ] && { echo "Falló el colector del índice de opacidad."; fallo=1; }
          [ "${{ steps.reciente.outcome }}" = "failure" ] && { echo "Falló el colector de publicación oficial reciente."; fallo=1; }
          [ "${{ steps.consulta.outcome }}" = "failure" ] && { echo "Falló el colector de consulta dirigida."; fallo=1; }
          [ "${{ steps.ciber.outcome }}" = "failure" ] && { echo "Falló el colector de medición de red."; fallo=1; }
