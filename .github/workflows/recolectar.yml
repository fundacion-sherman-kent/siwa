name: Recolección

on:
  schedule:
    # Cada hora: lo que cambia seguido.
    - cron: "17 * * * *"
    # Una vez por día: series anuales y catálogos, que cambian despacio.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    env:
      # A mano o en la corrida diaria se recolecta todo; en las horarias, solo lo que cambia seguido.
      COMPLETA: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 5 * * *' }}

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Transversal, cada hora ---
      - name: Cobertura noticiosa cruzada
        id: cobertura
        continue-on-error: true
        run: python colectores/cobertura.py

      - name: Circulacion en red social abierta
        id: redes
        continue-on-error: true
        run: python colectores/redes.py

      - name: Difusion en canales de mensajeria
        id: telegram
        continue-on-error: true
        run: python colectores/telegram.py

      - name: Conflictos territoriales y mineria ilegal
        id: conflictos
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/conflictos.py

      - name: Brecha espejo del comercio declarado
        id: comercio
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/comercio.py

      - name: Extorsion informatica
        id: ransomware
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/ransomware.py

      - name: Indice de Transformacion Bertelsmann
        id: bti
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/bti.py

      - name: Informes de la Fundacion
        id: fundacion
        continue-on-error: true
        run: python colectores/fundacion.py

      # --- Series anuales y catalogos, una vez por dia ---
      - name: Indicadores comparables (Banco Mundial)
        id: banco
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/banco_mundial.py

      - name: Indicadores de los ODS (Naciones Unidas)
        id: ods
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/onu_ods.py

      - name: Desplazamiento forzado (ACNUR)
        id: desplazamiento
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/desplazamiento.py

      - name: Democracia, terrorismo y conflicto (V-Dem, GTD, UCDP)
        id: owd
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/owd.py

      - name: Padron de fuentes oficiales
        id: oficiales
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/fuentes_oficiales.py

      - name: Guardar lo recolectado
        if: always()
        run: |
          git config user.name "siwa"
          git config user.email "actions@users.noreply.github.com"
          # La regla de .gitattributes necesita que el controlador exista.
          git config merge.ours.driver true
          git add datos/
          git diff --staged --quiet || git commit -m "Recolección $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Si alguien subio algo mientras corria la recoleccion, se trae y se
          # reintenta en lugar de fallar. Los datos se resuelven solos por la
          # regla de .gitattributes; el codigo ajeno se conserva intacto.
          for intento in 1 2 3; do
            git push && break
            git pull --no-rebase --no-edit origin main || exit 1
          done

      # Si algun colector fallo, la corrida queda en rojo. El dato anterior no se pisa
      # y la falla queda registrada en datos/publico/estado/.
      - name: Declarar las fallas
        if: always()
        run: |
          fallo=0
          [ "${{ steps.cobertura.outcome }}" = "failure" ] && { echo "Falló el colector de cobertura noticiosa."; fallo=1; }
          [ "${{ steps.banco.outcome }}" = "failure" ] && { echo "Falló el colector del Banco Mundial."; fallo=1; }
          [ "${{ steps.ods.outcome }}" = "failure" ] && { echo "Falló el colector de los ODS."; fallo=1; }
          [ "${{ steps.desplazamiento.outcome }}" = "failure" ] && { echo "Falló el colector de desplazamiento forzado."; fallo=1; }
          [ "${{ steps.oficiales.outcome }}" = "failure" ] && { echo "Falló el padrón de fuentes oficiales."; fallo=1; }
          [ "${{ steps.redes.outcome }}" = "failure" ] && { echo "Falló el colector de circulación en redes."; fallo=1; }
          [ "${{ steps.owd.outcome }}" = "failure" ] && { echo "Falló el colector de democracia y conflicto."; fallo=1; }
          [ "${{ steps.telegram.outcome }}" = "failure" ] && { echo "Falló el colector de canales de mensajería."; fallo=1; }
          [ "${{ steps.conflictos.outcome }}" = "failure" ] && { echo "Falló el colector de conflictos territoriales."; fallo=1; }
          [ "${{ steps.comercio.outcome }}" = "failure" ] && { echo "Falló el colector de brecha espejo."; fallo=1; }
          [ "${{ steps.ransomware.outcome }}" = "failure" ] && { echo "Falló el colector de extorsión informática."; fallo=1; }
          [ "${{ steps.bti.outcome }}" = "failure" ] && { echo "Falló el colector del índice Bertelsmann."; fallo=1; }
          [ "${{ steps.fundacion.outcome }}" = "failure" ] && { echo "Falló el colector de informes de la Fundación."; fallo=1; }
          exit $fallo
