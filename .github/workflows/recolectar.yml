name: Recolección

on:
  schedule:
    # Cada hora: lo que cambia seguido.
    - cron: "17 * * * *"
    # Una vez por día: series anuales y catálogos, que cambian despacio.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    env:
      # A mano o en la corrida diaria se recolecta todo; en las horarias, solo lo que cambia seguido.
      COMPLETA: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 5 * * *' }}

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Transversal, cada hora ---
      - name: Cobertura noticiosa cruzada
        id: cobertura
        continue-on-error: true
        run: python colectores/cobertura.py

      # --- Series anuales y catalogos, una vez por dia ---
      - name: Indicadores comparables (Banco Mundial)
        id: banco
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/banco_mundial.py

      - name: Desplazamiento forzado (ACNUR)
        id: desplazamiento
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/desplazamiento.py

      - name: Padron de fuentes oficiales
        id: oficiales
        if: env.COMPLETA == 'true'
        continue-on-error: true
        run: python colectores/fuentes_oficiales.py

      - name: Guardar lo recolectado
        if: always()
        run: |
          git config user.name "siwa"
          git config user.email "actions@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "Recolección $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # Si algun colector fallo, la corrida queda en rojo. El dato anterior no se pisa
      # y la falla queda registrada en datos/publico/estado/.
      - name: Declarar las fallas
        if: always()
        run: |
          fallo=0
          [ "${{ steps.cobertura.outcome }}" = "failure" ] && { echo "Falló el colector de cobertura noticiosa."; fallo=1; }
          [ "${{ steps.banco.outcome }}" = "failure" ] && { echo "Falló el colector del Banco Mundial."; fallo=1; }
          [ "${{ steps.desplazamiento.outcome }}" = "failure" ] && { echo "Falló el colector de desplazamiento forzado."; fallo=1; }
          [ "${{ steps.oficiales.outcome }}" = "failure" ] && { echo "Falló el padrón de fuentes oficiales."; fallo=1; }
          exit $fallo
